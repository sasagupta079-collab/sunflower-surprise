<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8e7">
  <title>A Little Sunflower Thought 🌻</title>
  <style>
    :root {
      --cream: #fff8e7;
      --gold: #f3bd35;
      --ink: #49391f;
      --green: #607747;
      --pink: #f8e4dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(243,189,53,.20), transparent 26%),
        radial-gradient(circle at 90% 85%, rgba(96,119,71,.13), transparent 25%),
        var(--cream);
      font-family: Georgia, "Times New Roman", serif;
    }
    .card {
      width: min(100%, 520px);
      text-align: center;
      padding: 36px 26px 30px;
      border: 1px solid rgba(157, 119, 44, .22);
      border-radius: 28px;
      background: rgba(255,255,255,.63);
      box-shadow: 0 18px 55px rgba(111, 83, 33, .10);
      position: relative;
      overflow: hidden;
    }
    .eyebrow {
      margin: 0 0 14px;
      text-transform: uppercase;
      letter-spacing: .18em;
      font: 700 11px/1.4 system-ui, sans-serif;
      color: var(--green);
    }
    .flower {
      width: 190px;
      max-width: 65%;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 9px 10px rgba(111, 83, 33, .12));
      animation: float 4s ease-in-out infinite;
    }
    h1 {
      margin: 8px 0 14px;
      font-size: clamp(29px, 7vw, 40px);
      line-height: 1.12;
      font-weight: 500;
    }
    .intro {
      margin: 0 auto;
      max-width: 365px;
      font-size: 16px;
      line-height: 1.8;
      color: #6d5b3d;
    }
    .divider {
      width: 58px;
      height: 2px;
      margin: 25px auto;
      border-radius: 2px;
      background: var(--gold);
    }
    .theory {
      margin: 0 auto;
      max-width: 370px;
      font-size: 16px;
      line-height: 1.8;
    }
    .love {
      margin: 28px 0 8px;
      color: #b56d42;
      font-size: clamp(35px, 9vw, 48px);
      font-style: italic;
    }
    .heart {
      color: #d78b6c;
      font-style: normal;
    }
    footer {
      margin-top: 23px;
      color: #8d7b5b;
      font: 12px/1.5 system-ui, sans-serif;
      letter-spacing: .04em;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flower { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="flower" viewBox="0 0 220 250" role="img" aria-label="Illustration of a bright sunflower">
      <defs>
        <radialGradient id="petal" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#ffe98a"/>
          <stop offset="100%" stop-color="#e9a91e"/>
        </radialGradient>
        <radialGradient id="center" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#80502b"/>
          <stop offset="100%" stop-color="#4c2e1c"/>
        </radialGradient>
      </defs>
      <path d="M110 135 C110 172 112 204 108 238" fill="none" stroke="#607747" stroke-width="9" stroke-linecap="round"/>
      <path d="M109 198 C75 160 51 183 73 201 C86 211 100 207 109 198Z" fill="#78935a"/>
      <path d="M111 216 C143 179 169 197 148 215 C137 225 122 223 111 216Z" fill="#607747"/>
      <g transform="translate(110 92)">
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(30)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(60)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(90)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(120)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(150)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(180)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(210)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(240)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(270)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(300)"/>
        <ellipse cy="-51" rx="17" ry="39" fill="url(#petal)" transform="rotate(330)"/>
        <circle r="34" fill="url(#center)"/>
        <g fill="#d5a15a" opacity=".8">
          <circle cx="-11" cy="-10" r="2.2"/><circle cx="2" cy="-15" r="2"/>
          <circle cx="13" cy="-8" r="2.2"/><circle cx="-17" cy="2" r="2"/>
          <circle cx="-5" cy="4" r="2.3"/><circle cx="8" cy="2" r="2"/>
          <circle cx="18" cy="8" r="2"/><circle cx="-12" cy="15" r="2"/>
          <circle cx="1" cy="16" r="2.2"/><circle cx="11" cy="18" r="1.8"/>
          <circle cx="0" cy="-3" r="2"/><circle cx="-21" cy="-12" r="1.7"/>
        </g>
      </g>
    </svg>

    <div class="divider"></div>

    <p class="theory" style="margin-top: 18px; font-style: italic;">All I can give you is this flower for now.</p>

    <p class="love">Love you butki <span class="heart">♡</span></p>
  </main>

    <script>
      // Sends one visit event each time this page loads. The server keeps WhatsApp credentials private.
      window.addEventListener("load", () => {
        fetch("/.netlify/functions/visit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ event: "page_open" }),
          keepalive: true
        }).catch(() => {
          // The surprise still works even if the notification service is unavailable.
        });
      });
    </script>

</body>
</html>
